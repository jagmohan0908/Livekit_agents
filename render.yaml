services:
  - type: worker
    name: vobiz-gemini-live
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    envVars:
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: LIVEKIT_AGENT_NAME
        value: vobiz-gemini-live
      - key: FRAPPE_BASE_URL
        sync: false
      - key: VOICE_AGENT_CONFIG_SECRET
        sync: false
      - key: GOOGLE_CLOUD_PROJECT
        sync: false
      - key: GOOGLE_APPLICATION_CREDENTIALS_JSON
        sync: false
      - key: VERTEX_LOCATION
        value: us-central1
      - key: GEMINI_LIVE_MODEL
        value: gemini-live-2.5-flash-native-audio
      - key: GEMINI_LIVE_VOICE
        value: Puck
      - key: MCP_SERVER_URL
        sync: false
      - key: MCP_BEARER_TOKEN
        sync: false
